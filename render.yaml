services:
  - type: web
    name: expense-tracker
    runtime: python
    plan: free
    buildCommand: python -c "import zipfile, os; os.path.exists('backend.zip') and zipfile.ZipFile('backend.zip').extractall('.')" && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
